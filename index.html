      if (this.PL.sp === 'spread') [-0.35, 0.35].forEach(a => this.bullets.create(this.ship.x, this.ship.y - 20, 'hb').setScale(0.5).setBlendMode(Phaser.BlendModes.ADD).setVelocity(Math.sin(a) * 520, -Math.cos(a) * 520).setRotation(a));

    }});
    this.time.addEvent({ delay: Math.max(200, Math.round(1000 / (1 + this.stage * 0.012) * (2.2 - 1.2 * this.dif))), loop: true, callback: () => {
      if (!this.go) return;

    }});
    this.time.addEvent({ delay: Math.max(350, Math.round(2000 / (1 + this.stage * 0.015) * (3 - 2 * this.dif))), loop: true, callback: () => {
      if (!this.go) return;

      if (r.length) { const e = Phaser.Utils.Array.GetRandom(r); if (this.stage < 3) return; e.dive = true; e.ready = false; this.sfx('dive'); e.setVelocity((this.ship.x - e.x) * 0.7, 240 + Math.min(this.stage, 150) * 3); }
    }});
    this.time.addEvent({ delay: Math.max(450, 1700 - this.stage * 20), loop: true, callback: () => {
      const b = this.boss; if (!this.go || !b || b.y < 90) return;
      this.bossShot(); { const n = this.bossType ? 0 : 3 + 2 * Math.min(5, Math.floor(this.stage / 12)), sp = Math.min(420, 150 + Math.min(this.stage, 60) * 3 + Math.max(0, this.stage - 60) * 0.2); for (let i = 0; i < n; i++) { const a = (i - (n - 1) / 2) * (1.2 / (n - 1)); this.ebs.create(b.x, b.y + 30, 'heb').setScale(0.5).setBlendMode(Phaser.BlendModes.ADD).setVelocity(Math.sin(a) * sp, Math.cos(a) * sp); } }
      this.sfx('bshot');

  }
  spawnWave() {
    this.wave++; this.drop = 0; this.wait2 = false; this.sfx('wave');
    const st = this.stage;
    let sd = (st * 7919 + this.wave * 104729) % 2147483647 || 1; const rn = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    const avail = st < 3 ? ['grid'] : st < 6 ? ['grid', 'vee', 'wall'] : ['grid', 'vee', 'diamond', 'wall', 'ring', 'zig', 'cols'];
    const pat = avail[Math.floor(rn() * avail.length)];
    const cols = 4 + (st >= 4 ? 1 : 0) + (st >= 12 ? 1 : 0), rows = Math.min(2 + Math.floor(st / 8), 5), P = [];
    if (pat === 'grid') { const gap = Math.min(70, 300 / cols); for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) P.push([180 + (c - (cols - 1) / 2) * gap, 80 + r * 48]); }
    else if (pat === 'vee') { const k = Math.min(4, 2 + Math.floor(st / 10)); P.push([180, 80]); for (let i = 1; i <= k; i++) { P.push([180 - i * 36, 80 + i * 30]); P.push([180 + i * 36, 80 + i * 30]); } if (st > 8) for (let i = 1; i <= k; i++) { P.push([180 - i * 36, 124 + i * 30]); P.push([180 + i * 36, 124 + i * 30]); } }
    else if (pat === 'diamond') { [1, 2, 3, 4, 3, 2, 1].forEach((w, r) => { for (let c = 0; c < w; c++) P.push([180 + (c - (w - 1) / 2) * 50, 70 + r * 38]); }); }
    else if (pat === 'wall') { const nr = 2 + (st >= 10 ? 1 : 0) + (st >= 40 ? 1 : 0); for (let r = 0; r < nr; r++) for (let c = 0; c < 7; c++) P.push([40 + c * 46.7, 80 + r * 40]); }
    else if (pat === 'ring') { const n = 10 + Math.min(6, Math.floor(st / 10)); for (let i = 0; i < n; i++) { const a = i / n * 6.283; P.push([180 + Math.cos(a) * 100, 160 + Math.sin(a) * 70]); } P.push([180, 160]); }
    else if (pat === 'zig') { for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) P.push([40 + i * 40, 80 + r * 70 + (i % 2) * 34]); }
    else { for (let c = 0; c < 3; c++) for (let j = 0; j < 4 + (st >= 20 ? 1 : 0); j++) P.push([70 + c * 110, 80 + j * 44]); }
    this.mt = st < 4 ? 0 : Math.floor(rn() * 3);
    const mx = Math.max(...P.map(p => Math.abs(p[0] - 180)));
    this.amp = Math.max(8, Math.min(40 + Math.min(st, 100) * 0.4, 170 - mx * (this.mt === 2 ? 1.18 : 1)));
    this.ps = (0.5 + 0.5 * this.dif) * (0.8 + rn() * 0.5);
    const T0 = st < 2 ? 1 : st < 5 ? 2 : 3;
    P.forEach((p, i) => {
      const rw = Math.round((p[1] - 70) / 40), ty = Math.min(3, Math.max(1, T0 - rw + Math.floor(st / 20)));
      const shield = st >= 8 && rn() < 0.12;
      const e = this.enemies.create(p[0], -40, 'he' + ty).setScale(0.5);
      e.hp = ty + Math.floor(Math.pow(st, 0.75) / 4) + (shield ? 2 : 0); e.pts = 10 * ty; e.hx = p[0]; e.hy = p[1]; e.rw = rw; e.sh = shield; e.t0 = this.time.now + i * 70;
      if (shield) e.setTint(0x80deea);
    });
  }
  spawnWaveOld() {
    this.wave++; this.drop = 0; this.wait2 = false; this.sfx('wave');
    const rows = Math.min(2 + Math.floor(this.stage / 8), 5);
    const T = r => Math.min(3, Math.max(1, (this.stage < 2 ? 2 : 3) - r + Math.floor(this.stage / 20)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < 5; c++) {
      const ty = T(r), e = this.enemies.create(40 + c * 70, -40, 'he' + ty).setScale(0.5);
      e.hp = ty + Math.floor(Math.pow(this.stage, 0.75) / 4); e.pts = 10 * ty; e.hx = 40 + c * 70; e.hy = 80 + r * 48; e.t0 = this.time.now + r * 220 + c * 70;
    }
  }
  bossShot() {
    const b = this.boss, t = this.bossType; if (!b || !t) return;
    const sp = Math.min(420, 150 + Math.min(this.stage, 60) * 3 + Math.max(0, this.stage - 60) * 0.2), mkB = (vx, vy) => this.ebs.create(b.x, b.y + 30, 'heb').setScale(0.5).setBlendMode(Phaser.BlendModes.ADD).setVelocity(vx, vy);

    else if (t === 3) { [-40, 40].forEach(dx => { const e = mkB(0, sp * 1.3); e.x = b.x + dx; }); [-0.3, 0.3].forEach(a => mkB(Math.sin(a) * sp, Math.cos(a) * sp)); }
    else { const a0 = this.mi * 0.35; for (let i = 0; i < 4; i++) { const a = a0 + i * 1.5708; mkB(Math.cos(a) * sp * 0.9, Math.sin(a) * sp * 0.9 + 60); } }
  }
  spawnBoss() {
    const b = this.bosses.create(180, -60, 'hbs' + (this.bossType = Math.floor((this.stage - 1) / 10) % 5)).setScale(0.5);
    b.hp = b.max = 40 + Math.round(35 * Math.pow(this.stage, 0.7)); b.pts = 500; b.isBoss = true; this.sfx('boss'); this.boss = b; this.wait2 = false;
    this.bar.setVisible(true).setSize(200, 6);
  }
  panel(title, color, lines, btns) {
    this.go = false; this.dead = true; this.physics.pause();
    const els = []; const add = o => { o.setDepth(10); els.push(o); return o; };

    };

    mk(430, () => { S('ys_gold', this.gold); S('ys_sel', Math.min(1000, this.stage + 1)); this.physics.resume(); this.scene.restart({ stage: Math.min(1000, this.stage + 1) }); }).setText('MENÜ');

  update(t, dt) {
    const s = Math.min(dt, 33) / 1000;
    this.neb.forEach(n => { n.y += n.v; if (n.y > H + 200) { n.y = -200; n.x = Math.random() * W; } });
    this.stars.forEach(o => { o.y += o.v; if (o.y > H) { o.y = 0; o.x = Math.random() * W; } });

    this.ship.x += (this.tgt.x - this.ship.x) * 0.25; this.ship.y += (this.tgt.y - this.ship.y) * 0.25;

    this.sway = Math.sin(t / 1000 * (0.8 + Math.min(this.stage, 100) * 0.02) * this.ps) * this.amp;
    this.drop = Math.min(100 + Math.min(this.stage, 100), this.drop + (2 + 3 * this.dif + this.stage * 0.05) * s);
    this.enemies.getChildren().forEach(e => {
      if (e.dive) { if (e.y > H + 40) { e.dive = false; e.setVelocity(0, 0); e.y = -40; } return; }
      if (this.time.now < e.t0) { e.x = e.hx; return; }
      const ty = e.hy + this.drop; e.x = this.mt === 2 ? 180 + (e.hx - 180) * (1 + 0.18 * Math.sin(t / 700)) + this.sway * 0.5 : e.hx + this.sway * (this.mt === 1 && e.rw % 2 ? -1 : 1);
      e.y = e.y < ty ? Math.min(ty, e.y + 260 * s) : ty;
      e.ready = Math.abs(e.y - ty) < 2;
    });
    const b = this.boss;
    if (b && b.active) {
      if (b.y < 90) b.y += 60 * s; else b.x = 180 + Math.sin(t / 700) * 100;
      this.bar.setSize(Math.max(1, 200 * b.hp / b.max), 6);
    }
    const tg = this.enemies.getChildren().concat(this.bosses.getChildren());
    this.bullets.getChildren().forEach(o => { if (!o.hm) return; let best = null, bd = 1e9; tg.forEach(e => { if (!e.active) return; const dd = (e.x - o.x) ** 2 + (e.y - o.y) ** 2; if (dd < bd) { bd = dd; best = e; } }); if (best) { const a = Math.atan2(best.y - o.y, best.x - o.x); o.setVelocity(Math.cos(a) * 420, Math.sin(a) * 420); o.setRotation(a + 1.5708); } });
    [this.bullets, this.ebs, this.pu].forEach(gp => gp.getChildren().forEach(o => { if (o.aura) o.aura.setPosition(o.x, o.y); if (o.y < -30 || o.y > H + 30 || o.x < -30 || o.x > W + 30) o.destroy(); }));
